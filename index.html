<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e3e7eb">
  <title>铲阵雷达｜自然之力阵容榜</title>
  <style>
    :root{
      --bg:#17161c;--panel:#1d1c23;--ink:#f6f3fa;--muted:#9a96a3;
      --purple:#c6a4ff;--gold:#f4c75d;--card:#eceaf0;--card-ink:#24222a;
      --line:rgba(255,255,255,.10);--safe-bottom:max(14px,env(safe-area-inset-bottom));
    }
    *{box-sizing:border-box}
    html{background:#111015}
    body{margin:0;background:#111015;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    button{font:inherit}
    button:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
    .app{position:relative;width:min(100%,560px);min-height:100svh;margin:auto;padding:0 0 calc(78px + var(--safe-bottom));overflow-x:hidden;background:var(--bg);box-shadow:0 0 60px rgba(0,0,0,.35)}
    .app-head{position:sticky;top:0;z-index:9;padding:calc(16px + env(safe-area-inset-top)) 16px 0;background:linear-gradient(180deg,rgba(23,22,28,.98) 82%,rgba(23,22,28,.92));backdrop-filter:blur(18px)}
    .titlebar{display:grid;grid-template-columns:70px 1fr 70px;align-items:center;height:54px}
    .live{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px}
    .live i{width:7px;height:7px;border-radius:50%;background:#f2b94f;box-shadow:0 0 0 4px rgba(242,185,79,.10)}
    .live.online i{background:#70e1b1;box-shadow:0 0 0 4px rgba(112,225,177,.10)}
    .season{text-align:center;font-size:20px;font-weight:750;letter-spacing:.02em;white-space:nowrap}
    .season small{margin-left:6px;color:var(--muted);font-size:11px;font-weight:500}
    .refresh{justify-self:end;border:0;color:var(--muted);background:transparent;font-size:19px}
    .top-tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
    .top-tabs button{position:relative;padding:11px 0 13px;border:0;color:#8e8998;background:transparent;font-size:16px}
    .top-tabs button.active{color:var(--purple);font-weight:750}
    .top-tabs button.active:after{content:"";position:absolute;right:10%;bottom:-1px;left:10%;height:3px;border-radius:5px;background:var(--purple)}
    .data-row{display:flex;align-items:center;gap:14px;height:46px;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
    .data-row::-webkit-scrollbar{display:none}
    .data-note{flex:0 0 auto;border:0;color:#d5a73e;background:transparent;padding:0;font-size:12px;text-decoration:underline;text-underline-offset:3px}
    .sort-btn{flex:0 0 auto;padding:7px 0;border:0;color:#8f8a98;background:transparent;font-size:12px}
    .sort-btn.active{color:var(--purple);font-weight:750}
    .filter-btn{display:flex;align-items:center;gap:5px;margin-left:auto;padding:7px 0 7px 7px;border:0;color:#aaa5b2;background:transparent;font-size:12px}
    .filter-btn svg{width:17px;height:17px}
    .active-filters{display:none;gap:7px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
    .active-filters.show{display:flex}
    .filter-chip{flex:0 0 auto;padding:5px 9px;border:1px solid rgba(198,164,255,.35);border-radius:999px;color:#d9c6ff;background:rgba(198,164,255,.08);font-size:10px}
    .meta-strip{display:flex;justify-content:space-between;padding:5px 17px 8px;color:#77727f;font-size:10px}
    .list{display:grid;gap:6px;padding:0 12px 20px}
    .comp-card{position:relative;display:grid;grid-template-columns:88px minmax(0,1fr);min-height:118px;overflow:hidden;border-radius:12px;background:var(--card);color:var(--card-ink);box-shadow:0 1px 0 rgba(255,255,255,.10);cursor:pointer}
    .poster{position:relative;min-height:118px;overflow:hidden;background:#3b3543}
    .poster img{width:100%;height:100%;min-height:118px;object-fit:cover;object-position:center top;display:block}
    .poster:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,rgba(8,7,10,.90))}
    .tier{position:absolute;z-index:1;top:5px;left:6px;color:#ffe548;font-size:27px;font-weight:950;line-height:1;-webkit-text-stroke:1.4px #2f2b19;text-shadow:0 2px 2px #000}
    .comp-name{position:absolute;z-index:1;right:5px;bottom:7px;left:5px;overflow:hidden;color:#f2d348;font-size:14px;font-weight:900;line-height:1.05;text-align:center;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 2px 3px #000}
    .card-body{min-width:0;padding:6px 8px 6px}
    .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding-right:27px;text-align:center}
    .metric span{display:block;color:#7b7680;font-size:8px;line-height:1.1}
    .metric strong{display:block;margin-top:2px;font-size:12px;font-weight:650}
    .copy{position:absolute;top:7px;right:7px;display:grid;place-items:center;width:25px;height:25px;border:0;border-radius:6px;color:#34303a;background:transparent;font-size:20px;line-height:1}
    .copy:disabled{opacity:.25}
    .heroes{display:flex;gap:4px;margin:7px 0 5px;overflow:hidden}
    .hero-icon{position:relative;flex:0 0 34px;width:34px;height:34px;border:2px solid #76828a;border-radius:50%;overflow:hidden;background:#37333f}
    .hero-icon.p1{border-color:#888}.hero-icon.p2{border-color:#5ba56d}.hero-icon.p3{border-color:#54a6cf}.hero-icon.p4{border-color:#b166c6}.hero-icon.p5{border-color:#e3a73d}
    .hero-icon img{width:100%;height:100%;object-fit:cover;display:block}
    .hero-icon b{position:absolute;right:-1px;bottom:-1px;display:grid;place-items:center;width:12px;height:12px;border-radius:50%;color:#fff;background:#3b3642;font-size:7px}
    .hero-icon.carry:after{content:"C";position:absolute;top:-1px;left:-1px;display:grid;place-items:center;width:12px;height:12px;border-radius:50%;color:#fff;background:#d750bb;font-size:7px;font-weight:900}
    .traits{display:flex;gap:4px;overflow:hidden;white-space:nowrap}
    .trait{display:flex;align-items:center;gap:3px;min-width:0;padding:2px 5px;border-radius:4px;color:#3d3943;background:#d8d6dc;font-size:9px}
    .trait.race{background:#e5dcc9}
    .trait img{width:12px;height:12px;object-fit:contain;filter:brightness(.35)}
    .trait b{font-weight:850}
    .empty{padding:60px 24px;text-align:center;color:var(--muted);font-size:13px}
    .detail-hint{position:absolute;bottom:12px;left:12px;color:var(--muted);font-size:10px;font-weight:700}
    .bottom-nav{position:fixed;z-index:10;right:50%;bottom:0;left:50%;display:grid;grid-template-columns:repeat(3,1fr);width:min(100%,560px);padding:9px 0 var(--safe-bottom);transform:translateX(-50%);border-top:1px solid var(--line);background:rgba(24,23,29,.96);backdrop-filter:blur(16px)}
    .nav-item{display:grid;place-items:center;gap:2px;border:0;color:#aaa5b0;background:transparent;font-size:10px}
    .nav-item strong{font-size:20px;line-height:1}
    .nav-item.active{color:var(--purple)}
    .backdrop{position:fixed;z-index:20;inset:0;visibility:hidden;opacity:0;background:rgba(0,0,0,.58);transition:.2s}
    .backdrop.open{visibility:visible;opacity:1}
    .filter-panel{position:fixed;z-index:21;top:0;right:max(0px,calc((100vw - 560px)/2));bottom:0;visibility:hidden;width:min(84vw,465px);padding:calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));overflow:auto;transform:translateX(104%);background:#1a191f;box-shadow:-18px 0 38px rgba(0,0,0,.36);transition:transform .24s ease,visibility 0s linear .24s}
    .filter-panel.open{visibility:visible;transform:translateX(0);transition-delay:0s}
    .filter-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .filter-head h2{margin:0;font-size:16px}
    .filter-head button{padding:7px 10px;border:0;border-radius:8px;color:#bcb6c4;background:#27252d;font-size:11px}
    .segmented{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
    .segmented button{padding:9px;border:0;border-radius:999px;color:#958f9e;background:transparent;font-size:13px}
    .segmented button.active{color:#392c4b;background:var(--purple);font-weight:850;box-shadow:0 5px 14px rgba(198,164,255,.24)}
    .filter-group{margin-bottom:17px}
    .group-title{display:flex;align-items:center;gap:10px;margin:12px 0;color:#f3eff7;font-size:13px;font-weight:850}
    .group-title:before,.group-title:after{content:"";height:1px;flex:1;background:var(--line)}
    .group-title b{color:#e5b84b}
    .hero-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px 6px}
    .hero-filter{position:relative;aspect-ratio:1;border:2px solid #57525e;border-radius:10px;overflow:hidden;background:#302e36;padding:0}
    .hero-filter img{width:100%;height:100%;object-fit:cover;display:block}
    .hero-filter.active{border-color:var(--purple);box-shadow:0 0 0 2px rgba(198,164,255,.20)}
    .trait-columns{display:grid;grid-template-columns:1fr 1fr;gap:22px}
    .trait-column h3{margin:0 0 10px;text-align:center;font-size:14px}
    .trait-option{display:flex;align-items:center;gap:8px;width:100%;margin:2px 0;padding:7px 8px;border:0;border-radius:8px;color:#d9d4df;background:transparent;text-align:left;font-size:12px}
    .trait-option img{width:19px;height:19px;object-fit:contain;filter:brightness(0) invert(1)}
    .trait-option.active{color:#31253f;background:var(--purple);font-weight:800}
    .trait-option.active img{filter:brightness(.25)}
    .filter-actions{position:sticky;bottom:-18px;display:grid;grid-template-columns:1fr 2fr;gap:10px;margin:18px -16px -18px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#1a191f 18%)}
    .filter-actions button{padding:11px;border:0;border-radius:11px;font-weight:800}
    .clear-btn{color:#bbb5c2;background:#2a2830}.done-btn{color:#342641;background:var(--purple)}
    .toast{position:fixed;z-index:50;right:50%;bottom:calc(82px + var(--safe-bottom));padding:9px 14px;opacity:0;transform:translate(50%,10px);border:1px solid rgba(198,164,255,.25);border-radius:999px;color:#efe5ff;background:#30273d;font-size:11px;pointer-events:none;transition:.2s}
    .toast.show{opacity:1;transform:translate(50%,0)}
    .detail-view{position:fixed;z-index:40;top:0;bottom:0;left:50%;visibility:hidden;width:min(100%,560px);overflow-y:auto;transform:translate(-50%,102%);background:#e8ebee;color:#1c1c1e;transition:transform .28s cubic-bezier(.22,.85,.3,1),visibility 0s linear .28s;overscroll-behavior:contain}
    .detail-view.open{visibility:visible;transform:translate(-50%,0);transition-delay:0s}
    .detail-head{position:sticky;z-index:3;top:0;display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid rgba(84,92,104,.14);background:rgba(239,241,244,.9);backdrop-filter:blur(24px) saturate(1.3)}
    .detail-back{display:grid;place-items:center;width:36px;height:36px;padding:0;border:1px solid rgba(84,92,104,.14);border-radius:50%;color:#007aff;background:rgba(255,255,255,.8);font-size:25px;line-height:1}
    .detail-title{min-width:0}.detail-title h2{margin:0;overflow:hidden;font-size:17px;font-weight:850;text-overflow:ellipsis;white-space:nowrap}.detail-title span{display:block;margin-top:2px;color:#737a85;font-size:9px}
    .detail-copy{height:34px;padding:0 11px;border:0;border-radius:11px;color:#fff;background:linear-gradient(180deg,#2194ff,#007aff);box-shadow:0 5px 13px rgba(0,122,255,.2);font-size:10px;font-weight:800}
    .detail-content{padding:14px 12px calc(28px + env(safe-area-inset-bottom))}
    .detail-section{margin-bottom:13px;padding:14px;border:1px solid rgba(255,255,255,.9);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(232,235,239,.95));box-shadow:0 10px 28px rgba(53,61,72,.1),inset 0 1px 0 #fff}
    .detail-section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 11px;color:#23262b;font-size:13px;font-weight:850}.detail-section-title span{color:#7b818b;font-size:9px;font-weight:600}
    .board-shell{position:relative;padding:15px 7px 12px;border-radius:18px;background:radial-gradient(circle at 50% 45%,rgba(47,88,116,.64),transparent 55%),linear-gradient(145deg,#21313e,#14202a);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -14px 35px rgba(0,0,0,.28)}
    .board-edge{display:flex;justify-content:space-between;margin:0 5px 7px;color:rgba(255,255,255,.57);font-size:8px;font-weight:700}
    .board-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:-2px}
    .board-cell{position:relative;aspect-ratio:.88;min-width:0;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);background:rgba(120,170,194,.16)}
    .board-cell:nth-child(even){background:rgba(154,193,210,.2)}
    .board-unit{position:absolute;inset:4px;overflow:hidden;clip-path:inherit;background:#36424d}
    .board-unit img{width:100%;height:100%;object-fit:cover;display:block}
    .board-unit:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 2px #8a939b;clip-path:inherit}
    .board-unit.p1:after{box-shadow:inset 0 0 0 2px #929292}.board-unit.p2:after{box-shadow:inset 0 0 0 2px #45b563}.board-unit.p3:after{box-shadow:inset 0 0 0 2px #2f9de2}.board-unit.p4:after{box-shadow:inset 0 0 0 2px #b85bd6}.board-unit.p5:after{box-shadow:inset 0 0 0 2px #f0ae2a}
    .board-items{position:absolute;z-index:2;right:1px;bottom:3px;left:1px;display:flex;justify-content:center;gap:1px}
    .board-items img{width:12px;height:12px;border:1px solid rgba(255,255,255,.72);border-radius:3px;background:#25303a;box-shadow:0 1px 3px #000}
    .board-star{position:absolute;z-index:2;top:4px;left:50%;transform:translateX(-50%);color:#ffe37a;font-size:7px;letter-spacing:-1px;text-shadow:0 1px 2px #000;white-space:nowrap}
    .equip-list{display:grid;gap:8px}
    .equip-hero{display:grid;grid-template-columns:42px minmax(0,1fr);align-items:center;gap:9px;padding:9px;border:1px solid rgba(84,92,104,.11);border-radius:16px;background:rgba(255,255,255,.58)}
    .equip-avatar{position:relative;width:42px;height:42px;overflow:hidden;border:2px solid #8b949d;border-radius:13px;background:#d7dbe0}.equip-avatar img{width:100%;height:100%;object-fit:cover}.equip-avatar b{position:absolute;right:1px;bottom:1px;padding:2px 4px;border-radius:5px;color:#fff;background:rgba(29,33,39,.78);font-size:7px}
    .equip-main{min-width:0}.equip-name{display:flex;align-items:center;gap:6px;margin-bottom:5px;color:#272a2f;font-size:11px;font-weight:850}.equip-name span{color:#858b94;font-size:8px;font-weight:600}
    .item-row{display:flex;flex-wrap:wrap;gap:6px}.item-chip{display:flex;align-items:center;gap:4px;min-width:0;padding:4px 6px 4px 4px;border-radius:9px;color:#49505a;background:#e5e9ed;font-size:8px}.item-chip img{width:22px;height:22px;border-radius:6px;background:#cfd5db}.no-item{color:#8a9098;font-size:9px}
    .guide-grid{display:grid;gap:8px}.guide-card{padding:10px 11px;border-radius:14px;background:rgba(226,230,234,.68)}.guide-card b{display:block;margin-bottom:4px;color:#007aff;font-size:9px}.guide-card p{margin:0;color:#505761;font-size:10px;line-height:1.55}
    .source-proof{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:11px;padding-top:11px;border-top:1px solid rgba(84,92,104,.12);color:#6f7680;font-size:9px}.source-proof a{color:#007aff;text-decoration:none;font-weight:750}
    @media(max-width:430px){
      .app-head{padding-right:12px;padding-left:12px}
      .list{padding-right:8px;padding-left:8px}
      .comp-card{grid-template-columns:80px minmax(0,1fr);min-height:108px}
      .poster,.poster img{min-height:108px}
      .card-body{padding:5px 6px}
      .hero-icon{flex-basis:29px;width:29px;height:29px}
      .metric strong{font-size:11px}
      .traits{gap:3px}.trait{padding:2px 4px;font-size:8px}
    }
    @media(min-width:561px){.app{border-right:1px solid #2d2a34;border-left:1px solid #2d2a34}.filter-panel{border-left:1px solid #312e37}}
  </style>
  <style id="bright-theme">
    :root{
      --bg:#f3f6fc;--panel:#ffffff;--ink:#17213a;--muted:#77809a;
      --purple:#7056d9;--purple-soft:#eee9ff;--blue:#3975f6;--teal:#109c8d;
      --gold:#d59219;--orange:#ff6b3d;--rose:#ed3f72;--card:#ffffff;--card-ink:#17213a;
      --line:#e4e8f2;--safe-bottom:max(14px,env(safe-area-inset-bottom));
    }
    html{background:#eef2f9}
    body{background:
      radial-gradient(circle at 10% -5%,rgba(112,86,217,.16),transparent 30%),
      radial-gradient(circle at 94% 10%,rgba(57,117,246,.12),transparent 26%),
      linear-gradient(180deg,#f8f9ff 0,#eff4fb 55%,#f7f9fd 100%);color:var(--ink)}
    button{color:inherit}
    button:focus-visible{outline:3px solid rgba(112,86,217,.28);outline-offset:2px}
    .app{background:transparent;box-shadow:0 0 50px rgba(39,50,86,.08)}
    .app-head{padding-top:calc(12px + env(safe-area-inset-top));background:rgba(248,250,255,.88);border-bottom:1px solid rgba(220,225,238,.9);box-shadow:0 8px 26px rgba(46,58,95,.06);backdrop-filter:blur(22px) saturate(1.25)}
    .titlebar{height:50px}
    .live{color:#6d7690;font-weight:650}
    .live i,.live.online i{background:#15a68f;box-shadow:0 0 0 4px rgba(21,166,143,.12)}
    .season{color:#1e2842;font-size:19px;font-weight:850}
    .season small{color:#8991a8}
    .refresh{display:grid;place-items:center;width:34px;height:34px;border:1px solid #e1e5ef;border-radius:50%;color:#52607d;background:#fff;box-shadow:0 4px 14px rgba(41,55,94,.08)}
    .top-tabs{gap:8px;padding:3px;border:1px solid #e1e5f0;border-radius:14px;background:#f0f2f8}
    .top-tabs button{padding:9px 0;border-radius:11px;color:#7a839b;font-size:14px}
    .top-tabs button.active{color:#fff;background:linear-gradient(135deg,#765ce0,#557cf3);box-shadow:0 5px 15px rgba(98,89,220,.25)}
    .top-tabs button.active:after{display:none}
    .data-row{height:48px;gap:9px}
    .data-note,.sort-btn,.filter-btn{flex:0 0 auto;padding:7px 10px;border:1px solid #e1e5ef;border-radius:999px;color:#707a93;background:#fff;font-size:11px;text-decoration:none;box-shadow:0 3px 10px rgba(43,55,89,.04)}
    .data-note{color:#9a6a10;background:#fff8df;border-color:#f0df9d}
    .sort-btn.active{color:#fff;border-color:transparent;background:linear-gradient(135deg,#7258dc,#426ff2);font-weight:800}
    .filter-btn{margin-left:0;color:#55617d}
    .grade-legend{display:flex;align-items:center;gap:6px;margin:0 -4px 10px;padding:8px 10px;overflow-x:auto;border:1px solid #e3e7f1;border-radius:12px;color:#707990;background:rgba(255,255,255,.82);font-size:10px;white-space:nowrap;scrollbar-width:none}
    .grade-legend b{color:#25304b}
    .grade-dot{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:6px;color:#fff;font-size:9px;font-weight:900}
    .grade-s{background:#e54273}.grade-a{background:#7160dc}.grade-b{background:#287fd8}.grade-c{background:#1b9b8d}.grade-d{background:#8992a6}
    .method-note{display:none;margin:0 0 11px;padding:11px 12px;border:1px solid #dfe4ef;border-radius:13px;color:#5e6881;background:#fff;font-size:11px;line-height:1.65;box-shadow:0 5px 16px rgba(43,55,89,.05)}
    .method-note.open{display:block}
    .active-filters{padding-top:9px;padding-bottom:0}
    .filter-chip{border-color:#d9d1fa;color:#5d49b0;background:#eeeaff}
    .meta-strip{padding:9px 16px;color:#788198;font-size:10px}
    .list{gap:12px;padding:0 10px 28px}
    .comp-card{display:block;min-height:0;border:1px solid rgba(218,224,237,.94);border-radius:20px;background:#fff;color:var(--card-ink);box-shadow:0 10px 28px rgba(44,58,96,.09),0 2px 4px rgba(44,58,96,.04)}
    .card-main{display:grid;grid-template-columns:88px minmax(0,1fr);min-height:130px}
    .poster{min-height:130px;border-radius:19px 0 0 0;background:#d8deea}
    .poster img{min-height:130px}
    .poster:after{inset:24% 0 0;background:linear-gradient(transparent,rgba(20,23,35,.82))}

    const SNAPSHOT=RAW_SNAPSHOT.map(x=>({...x,code:CODES[x.id],careers:[...new Set(x.careers.map(n=>CAREER_CANONICAL.get(n)||n))].map(toTrait),races:[...new Set(x.origins.map(n=>RACE_CANONICAL.get(n)||n))].map(toTrait),poster:x.image,heroes:x.core.split(" · ").map((name,i)=>({name,picture:i===0?x.image:"",poster:i===0?x.image:"",price:0,isCarry:i===0}))}));
    const state={
      comps:DATA_TFT_SNAPSHOT.length?DATA_TFT_SNAPSHOT:SNAPSHOT,
      catalog:{
        heroes:[...new Map(DATA_TFT_SNAPSHOT.flatMap(x=>x.heroes).map(x=>[x.name,x])).values()].sort((a,b)=>Number(a.price)-Number(b.price)||a.name.localeCompare(b.name,"zh-CN")),
        careers:[...new Map(DATA_TFT_SNAPSHOT.flatMap(x=>x.careers).map(x=>[x.name,x])).values()],
        races:[...new Map(DATA_TFT_SNAPSHOT.flatMap(x=>x.races).map(x=>[x.name,x])).values()]
      },
      sort:"compositeScore",view:"rank",filterTab:"trait",hero:"",career:"",race:""
    };
    const $=id=>document.getElementById(id);
    const esc=s=>String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
    const uniqueByName=items=>[...new Map(items.map(x=>[x.name,x])).values()];

    function traitMarkup(t,type){return `<span class="trait ${type}">${t.picture?`<img src="${esc(t.picture)}" alt="">`:""}<b>${esc(t.name)}</b></span>`}
    function cardMarkup(x,index){
      const heroes=x.heroes.slice(0,8).map(h=>`<span class="hero-icon p${Number(h.price)||0} ${h.isCarry?"carry":""}" title="${esc(h.name)}">${h.picture?`<img src="${esc(h.picture)}" alt="${esc(h.name)}">`:""}<b>${h.price||""}</b></span>`).join("");
      const traits=[...x.races.slice(0,2).map(t=>traitMarkup(t,"race")),...x.careers.slice(0,2).map(t=>traitMarkup(t,"career"))].join("");
      const tierNames={S:"顶级",A:"强势",B:"稳定",C:"观察",D:"慎选"};
      const trend=x.trend?.mentions?`<span class="trend-pill">抖音热度 ${x.trend.mentions}</span>`:"";
      const verified=x.dataJ?`<span class="verify-pill">双源验证</span>`:`<span>DataTFT</span>`;
      return `<article class="comp-card" data-open-detail="${esc(x.id)}" role="button" tabindex="0" aria-label="查看${esc(x.name)}的站位和装备"><div class="card-main"><div class="poster"><img src="${esc(x.poster||x.image)}" alt="${esc(x.name)}"><span class="rank-no">#${index+1}</span><span class="tier tier-${esc(String(x.tier||"").toLowerCase())}">${esc(x.tier||"—")} · ${esc(tierNames[x.tier]||"未评级")}</span><span class="comp-name">${esc(x.name)}</span></div><div class="card-body"><div class="card-title-row"><h3 class="comp-title">${esc(x.name)}</h3>${trend}</div><div class="source-line">${verified}<span>${Number(x.sampleCount||0).toLocaleString("zh-CN")} 局样本</span></div><div class="metrics"><div class="metric"><span>平均排名</span><strong>${Number(x.avgPlacement).toFixed(2)}</strong></div><div class="metric"><span>前四率</span><strong>${Number(x.top4Rate).toFixed(1)}%</strong></div><div class="metric"><span>登顶率</span><strong>${Number(x.topRate).toFixed(1)}%</strong></div></div><div class="heroes">${heroes}</div><div class="traits">${traits}</div></div></div><span class="detail-hint">查看站位与装备 ›</span><button class="copy copy-code" data-copy="${esc(x.id)}" ${x.code?"":"disabled"} aria-label="${x.code?`复制${esc(x.name)}阵容码`:"阵容码待补"}"><strong>复制阵容码</strong></button></article>`;
    }

    function formatSourceTime(value){const date=new Date(value);return Number.isNaN(date.getTime())?"随今日阵容更新":date.toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}
    function itemMarkup(item){return `<span class="item-chip"><img src="${esc(item.picture)}" alt="${esc(item.name)}"><span>${esc(item.name)}</span></span>`}
    function boardMarkup(x){
      const positioned=new Map((x.board||[]).map(hero=>[Number(hero.index),hero]));
      const rows=[0,1,2,3].map(row=>`<div class="board-row">${[0,1,2,3,4,5,6].map(col=>{const hero=positioned.get(row*7+col);if(!hero)return`<div class="board-cell"></div>`;const shown=hero.replacement||hero;const items=(hero.equips||[]).slice(0,3).map(item=>`<img src="${esc(item.picture)}" alt="${esc(item.name)}" title="${esc(item.name)}">`).join("");const stars=Number(hero.stars||2);return`<div class="board-cell" title="第${row+1}排第${col+1}格 · ${esc(shown.name)}"><div class="board-unit p${Number(hero.price)||0}"><img src="${esc(shown.picture)}" alt="${esc(shown.name)}"><span class="board-star">${"★".repeat(Math.min(3,Math.max(1,stars)))}</span>${items?`<span class="board-items">${items}</span>`:""}</div></div>`}).join("")}</div>`).join("");
      return `<div class="board-shell"><div class="board-edge"><span>前排</span><span>敌方方向</span></div>${rows}<div class="board-edge" style="margin-top:7px;margin-bottom:0"><span>己方方向</span><span>后排</span></div></div>`;
    }
    function equipmentMarkup(x){
      return (x.board||[]).filter(hero=>Number(hero.id)<999000).sort((a,b)=>(b.equips?.length||0)-(a.equips?.length||0)||a.index-b.index).map(hero=>{const shown=hero.replacement||hero;const items=(hero.equips||[]).map(itemMarkup).join("");return`<div class="equip-hero"><div class="equip-avatar"><img src="${esc(shown.picture)}" alt="${esc(shown.name)}"><b>${hero.row}-${hero.col}</b></div><div class="equip-main"><div class="equip-name">${esc(shown.name)}<span>第 ${hero.row} 排 · 第 ${hero.col} 格</span></div><div class="item-row">${items||`<span class="no-item">该站位未指定固定装备，优先给主C和主坦</span>`}</div></div></div>`}).join("");
    }
    function guideMarkup(x){
      const guide=x.guide||{};
      const cards=[["核心思路",guide.core],["开局条件",guide.open],["前期",guide.earlyDesc],["中期",guide.midDesc],["成型",guide.finalDesc]].filter(([,text])=>text).map(([label,text])=>`<div class="guide-card"><b>${label}</b><p>${esc(text)}</p></div>`).join("");
      return `${cards?`<div class="guide-grid">${cards}</div>`:""}<div class="source-proof"><span>${esc(guide.source||"DataTFT 一图流")} · ${formatSourceTime(guide.updatedAt)}</span>${guide.teamUrl?`<a href="${esc(guide.teamUrl)}" target="_blank" rel="noopener noreferrer">核对原始站位 ↗</a>`:""}</div>`;
    }
    function openDetail(id){
      const x=state.comps.find(comp=>comp.id===id);if(!x)return;
      state.detailId=id;$('detailTitle').textContent=x.name;$('detailSubtitle').textContent=`${x.board?.length||0} 名棋子 · 站位与推荐装备`;
      $('detailCopy').disabled=!x.code;
      $('detailContent').innerHTML=`<section class="detail-section"><h3 class="detail-section-title">详细站位<span>点击卡片对应的今日一图流</span></h3>${boardMarkup(x)}</section><section class="detail-section"><h3 class="detail-section-title">棋子装备<span>有装备的棋子优先显示</span></h3><div class="equip-list">${equipmentMarkup(x)}</div></section><section class="detail-section"><h3 class="detail-section-title">运营要点<span>与本阵容同源更新</span></h3>${guideMarkup(x)}</section>`;
      $('detailView').classList.add('open');$('detailView').setAttribute('aria-hidden','false');$('detailView').scrollTop=0;document.body.style.overflow='hidden';
    }
    function closeDetail(){$('detailView').classList.remove('open');$('detailView').setAttribute('aria-hidden','true');state.detailId='';document.body.style.overflow=''}
    function filteredRows(){
      let rows=state.comps.filter(x=>(!state.hero||x.heroes.some(h=>h.name===state.hero))&&(!state.career||x.careers.some(t=>t.name===state.career))&&(!state.race||x.races.some(t=>t.name===state.race)));
      return rows.sort((a,b)=>state.sort==="avgPlacement"?a.avgPlacement-b.avgPlacement:b[state.sort]-a[state.sort]);
    }
    function render(){
      const rows=filteredRows();
      $("list").innerHTML=rows.map(cardMarkup).join("")||`<div class="empty">没有同时符合这些条件的阵容<br>可以点“筛选”后重置条件</div>`;
      $("count").textContent=`${rows.length} / ${state.comps.length} 套真实阵容`;
      const chips=[];if(state.hero)chips.push(`英雄：${state.hero}`);if(state.race)chips.push(`种族：${state.race}`);if(state.career)chips.push(`职业：${state.career}`);
      $("activeFilters").innerHTML=chips.map(x=>`<span class="filter-chip">${esc(x)}</span>`).join("");$("activeFilters").classList.toggle("show",chips.length>0);renderFilterContent();
    }
    function renderFilterContent(){
      const content=$("filterContent");
      if(state.filterTab==="hero"){
        if(!state.catalog.heroes.length){content.innerHTML=`<div class="empty">英雄资料正在随实时数据加载</div>`;return}
        const prices=[1,2,3,4,5,0];
        content.innerHTML=prices.map(price=>{const group=state.catalog.heroes.filter(h=>Number(h.price)===price);if(!group.length)return"";return `<section class="filter-group"><div class="group-title"><b>◉ ${price}</b></div><div class="hero-grid">${group.map(h=>`<button class="hero-filter ${state.hero===h.name?"active":""}" data-hero="${esc(h.name)}" title="${esc(h.name)}"><img src="${esc(h.picture)}" alt="${esc(h.name)}"></button>`).join("")}</div></section>`}).join("");return;
      }
      const traitButton=(t,type)=>`<button class="trait-option ${state[type]===t.name?"active":""}" data-trait-type="${type}" data-trait="${esc(t.name)}">${t.picture?`<img src="${esc(t.picture)}" alt="">`:"<span>◆</span>"}<span>${esc(t.name)}</span></button>`;
      content.innerHTML=`<div class="trait-columns"><section class="trait-column"><h3>种族</h3>${state.catalog.races.map(t=>traitButton(t,"race")).join("")||"<div class='empty'>加载中</div>"}</section><section class="trait-column"><h3>职业</h3>${state.catalog.careers.map(t=>traitButton(t,"career")).join("")||"<div class='empty'>加载中</div>"}</section></div>`;
    }
    function openFilter(){renderFilterContent();$("backdrop").classList.add("open");$("filterPanel").classList.add("open");$("filterPanel").setAttribute("aria-hidden","false");document.body.style.overflow="hidden"}
    function closeFilter(){$("backdrop").classList.remove("open");$("filterPanel").classList.remove("open");$("filterPanel").setAttribute("aria-hidden","true");document.body.style.overflow=""}
    function toast(message){$("toast").textContent=message;$("toast").classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>$("toast").classList.remove("show"),1700)}
    function legacyCopy(code){const t=document.createElement("textarea");t.value=code;t.setAttribute("readonly","");t.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:.01";document.body.appendChild(t);t.focus();t.setSelectionRange(0,t.value.length);let ok=false;try{ok=document.execCommand("copy")}catch{}t.remove();return ok}
    async function copyCode(id,button){const code=state.comps.find(x=>x.id===id)?.code;if(!code)return;let ok=false;let modernCopy=null;try{modernCopy=navigator.clipboard?.writeText?.(code)||null}catch{}if(modernCopy){try{await modernCopy;ok=true}catch{}}if(!ok)ok=legacyCopy(code);if(ok&&button){const label=button.querySelector("strong")||button;const old=label.textContent;label.textContent="已复制 ✓";setTimeout(()=>label.textContent=old,1600)}toast(ok?"阵容码已复制，可到游戏中粘贴":"复制失败，请长按阵容码按钮重试")}

    document.querySelectorAll("[data-filter-tab]").forEach(b=>b.onclick=()=>{state.filterTab=b.dataset.filterTab;document.querySelectorAll("[data-filter-tab]").forEach(x=>x.classList.toggle("active",x===b));renderFilterContent()});
    $("list").onclick=e=>{const b=e.target.closest("[data-copy]");if(b){e.stopPropagation();copyCode(b.dataset.copy,b);return}const card=e.target.closest("[data-open-detail]");if(card)openDetail(card.dataset.openDetail)};
    $("list").onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&!e.target.closest("[data-copy]")){const card=e.target.closest("[data-open-detail]");if(card){e.preventDefault();openDetail(card.dataset.openDetail)}}};
    $("filterContent").onclick=e=>{const hero=e.target.closest("[data-hero]");if(hero){state.hero=state.hero===hero.dataset.hero?"":hero.dataset.hero;render();return}const trait=e.target.closest("[data-trait]");if(trait){const type=trait.dataset.traitType;state[type]=state[type]===trait.dataset.trait?"":trait.dataset.trait;render()}};
    $("closeFilter").onclick=closeFilter;$("backdrop").onclick=closeFilter;$("doneFilter").onclick=closeFilter;
    $("clearFilter").onclick=()=>{state.hero="";state.race="";state.career="";render();toast("筛选已重置")};
    $("navInfo").onclick=()=>{state.filterTab="hero";document.querySelectorAll("[data-filter-tab]").forEach(x=>x.classList.toggle("active",x.dataset.filterTab==="hero"));openFilter()};
    $("closeDetail").onclick=closeDetail;
    $("detailCopy").onclick=e=>{if(state.detailId)copyCode(state.detailId,e.currentTarget)};
    document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("detailView").classList.contains("open"))closeDetail()});

    async function refresh(){
      $("status").classList.remove("online");$("status").querySelector("span").textContent="连接中";
      try{
        const base="https://www.dataj.cc/api/web";
        const versions=await fetch(`${base}/gamedata/gameVersion?setId=18`).then(r=>{if(!r.ok)throw Error(r.status);return r.json()});
        const version=versions.data.find(x=>x.battleCount>0)||versions.data[0];
        const [rank,catalog]=await Promise.all([fetch(`${base}/comp/rank?setId=${version.setId}&gameVersion=${encodeURIComponent(version.gameVersion)}&minSample=1`).then(r=>r.json()),fetch(`${base}/gamedata?setId=${version.setId}`).then(r=>r.json())]);
        const traitCatalog=uniqueByName(catalog.data.trait||[]),heroCatalog=uniqueByName((catalog.data.hero||[]).filter(h=>h.isVisible!==false));
        const careerNames=new Set(traitCatalog.filter(t=>String(t.type)==="1").map(t=>t.name)),raceNames=new Set(traitCatalog.filter(t=>String(t.type)==="0").map(t=>t.name));
        const traitByName=new Map(traitCatalog.map(t=>[t.name,t])),heroByName=new Map(heroCatalog.map(h=>[h.name,h]));
        state.catalog={heroes:heroCatalog.sort((a,b)=>Number(a.price)-Number(b.price)||a.name.localeCompare(b.name,"zh-CN")),careers:traitCatalog.filter(t=>String(t.type)==="1"),races:traitCatalog.filter(t=>String(t.type)==="0")};
        state.comps=rank.data.slice(0,30).map(x=>{
          const careers=[],races=[];
          x.traits.forEach(t=>{const careerName=CAREER_CANONICAL.get(t.name)||(careerNames.has(t.name)?t.name:"");const raceName=RACE_CANONICAL.get(t.name)||(raceNames.has(t.name)?t.name:t.name);const name=careerName||raceName,target=careerName?careers:races;target.push(traitByName.get(name)||{name,picture:""})});
          const heroes=x.heroes.map(h=>{const data=heroByName.get(h.heroName)||{};return{...h,picture:data.picture||"",poster:data.heroPoster||data.picture||"",price:h.price||data.price||0}}),lead=heroes.find(h=>h.isCarry)||heroes.find(h=>h.isCore)||heroes[0];
          return{id:String(x.compId),name:x.name,tier:x.tier||"—",avgPlacement:x.avgPlacement,top4Rate:x.top4Rate,topRate:x.topRate,sampleCount:x.sampleCount,careers:uniqueByName(careers),races:uniqueByName(races),heroes,poster:lead?.poster||"",code:CODES[String(x.compId)]};
        });
        const catalogVersion=heroCatalog.find(h=>h.version)?.version||version.gameVersion;
        $("version").textContent=`${catalogVersion}⌄`;$("updated").textContent=`实时 · ${new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})}`;
        $("status").classList.add("online");$("status").querySelector("span").textContent="实时";render();
      }catch(error){$("status").querySelector("span").textContent="快照";$("updated").textContent="实时源暂不可用";render()}
    }
    function showDailySnapshot(){
      const updated=new Date(DATA_TFT_UPDATED_AT);
      const checked=new Date(SOURCE_CHECKED_AT);
      const official=new Date(OFFICIAL_GAME_UPDATE.updatedAt);
      $("status").classList.add("online");$("status").querySelector("span").textContent="三源已核验";
      const time=Number.isNaN(checked.getTime())?"每日 08:00":checked.toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
      $("updated").textContent=`${time} · 抖音${DOUYIN_TREND_COUNT}条`;
      $("updated").title=`阵容战绩：${Number.isNaN(updated.getTime())?"今日快照":updated.toLocaleString("zh-CN")}；数据平台交叉匹配：${DATAJ_MATCH_COUNT}套；游戏官方更新：${Number.isNaN(official.getTime())?OFFICIAL_GAME_UPDATE.title:official.toLocaleString("zh-CN")}；抖音近期内容：${DOUYIN_TREND_COUNT}条`;
      render();
    }
    $("refresh").onclick=()=>{location.reload();toast("正在重新载入今日数据")};
    render();showDailySnapshot();
  </script>
</body>
</html>
