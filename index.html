<body>

      {id:"90",name:"裁决奶妈",tier:"C",avgPlacement:4.79,top4Rate:44.52,topRate:10.06,sampleCount:5072,core:"索拉卡 · 婕拉 · 墨菲特",image:"https://img.dataj.cc/images/s18/hero/s18_head_soraka.png",careers:["裁决使","召唤师","主宰"],origins:["地狱火","黑荆棘"]},

    const state={comps:SNAPSHOT,sort:"avgPlacement",career:"全部职业",origin:"全部特质"};
    const $=id=>document.getElementById(id);
    const esc=s=>String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));

    function render(){fillSelect("career","全部职业",state.comps.flatMap(x=>x.careers));fillSelect("origin","全部特质",state.comps.flatMap(x=>x.origins));state.career=$("career").value;state.origin=$("origin").value;const rows=state.comps.filter(x=>(state.career==="全部职业"||x.careers.includes(state.career))&&(state.origin==="全部特质"||x.origins.includes(state.origin))).sort((a,b)=>state.sort==="avgPlacement"?a.avgPlacement-b.avgPlacement:b[state.sort]-a[state.sort]);$("list").innerHTML=rows.map((x,i)=>`<article class="card"><span class="rank">${String(i+1).padStart(2,"0")}</span><img class="avatar" src="${esc(x.image)}" alt="${esc(x.name)}" onerror="this.style.visibility='hidden'"><div class="main"><div class="title"><h3>${esc(x.name)}</h3><span class="tier ${esc(x.tier)}">${esc(x.tier)}</span></div><p class="core">${esc(x.core)}</p><div class="traits">${x.careers.slice(0,2).map(t=>`<span>${esc(t)}</span>`).join("")}${x.origins.slice(0,1).map(t=>`<span class="origin">${esc(t)}</span>`).join("")}</div></div><div class="metrics"><div><span>平均</span><strong>${x.avgPlacement.toFixed(2)}</strong></div><div><span>前四</span><strong>${x.top4Rate.toFixed(1)}%</strong></div><div><span>登顶</span><strong>${x.topRate.toFixed(1)}%</strong></div></div><button class="copy" data-id="${esc(x.id)}" ${x.code?"":"disabled"}>${x.code?"复制阵容码":"暂无可核验码"}</button></article>`).join("")||"<p>没有符合条件的阵容</p>"}
